<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">

<title>Chem Test 2 Navigator</title>
<meta name="description" content="Flowchart study aid for CHEM 1110 Test 2 (HW 7–12): pick the question type, follow the steps from the notes, check your answer.">
<style>
:root{
  --bg:#f6f4ee; --card:#ffffff; --ink:#1b1d22; --muted:#5d6370; --line:#e4e0d5; --soft:#f0ede4;
  --accent:#2457c5; --accent-soft:#e7eefc; --ok:#1c6b3c; --ok-bg:#e6f5ec; --bad:#a12a2a; --bad-bg:#fcebea;
  --warn-bg:#fff5df; --warn-ink:#6f4a00;
  --light:#c26a12; --elec:#6a4bc4; --table:#11808a; --name:#b23a6b; --bond:#2f7d32;
  --radius:14px; --shadow:0 1px 2px rgba(20,20,30,.05),0 4px 16px rgba(20,20,30,.05);
  --mono:ui-monospace,SFMono-Regular,Menlo,Consolas,monospace;
}
@media (prefers-color-scheme: dark){
  :root:not([data-theme="light"]){
    --bg:#131519; --card:#1c1f25; --ink:#e9eaee; --muted:#9ba1ad; --line:#2e323a; --soft:#23272e;
    --accent:#7aa2ff; --accent-soft:#1e2a45; --ok:#8fe0ae; --ok-bg:#15301f; --bad:#f4a3a3; --bad-bg:#3a1c1c;
    --warn-bg:#352a12; --warn-ink:#f1cf86;
    --light:#f0a052; --elec:#a891ff; --table:#4cc3cc; --name:#f07aa8; --bond:#7cd07f;
    --shadow:none;
  }
}
:root[data-theme="dark"]{
  --bg:#131519; --card:#1c1f25; --ink:#e9eaee; --muted:#9ba1ad; --line:#2e323a; --soft:#23272e;
  --accent:#7aa2ff; --accent-soft:#1e2a45; --ok:#8fe0ae; --ok-bg:#15301f; --bad:#f4a3a3; --bad-bg:#3a1c1c;
  --warn-bg:#352a12; --warn-ink:#f1cf86;
  --light:#f0a052; --elec:#a891ff; --table:#4cc3cc; --name:#f07aa8; --bond:#7cd07f; --shadow:none;
}
*{box-sizing:border-box}
html{-webkit-text-size-adjust:100%}
body{margin:0;background:var(--bg);color:var(--ink);font:16px/1.55 system-ui,-apple-system,"Segoe UI",Roboto,Helvetica,Arial,sans-serif}
a{color:var(--accent)}
code{font-family:var(--mono);font-size:.92em;background:var(--soft);padding:1px 5px;border-radius:5px}
header.top{position:sticky;top:0;z-index:5;background:color-mix(in srgb,var(--bg) 88%,transparent);backdrop-filter:blur(8px);border-bottom:1px solid var(--line)}
header.top .in{max-width:820px;margin:0 auto;padding:10px 16px;display:flex;align-items:center;gap:10px}
.brand{font-weight:700;text-decoration:none;color:var(--ink);letter-spacing:-.01em;display:flex;align-items:center;gap:8px}
.brand .mark{width:26px;height:26px;border-radius:8px;background:var(--accent);color:#fff;display:grid;place-items:center;font-size:13px}
header.top nav{margin-left:auto;display:flex;gap:6px}
.btn{display:inline-flex;align-items:center;gap:6px;border:1px solid var(--line);background:var(--card);color:var(--ink);border-radius:999px;padding:7px 14px;font:inherit;font-size:14px;text-decoration:none;cursor:pointer}
.btn:hover{border-color:var(--accent)}
.btn.ghost{background:transparent}
main{max-width:820px;margin:0 auto;padding:18px 16px 60px}
.hero{padding:18px 2px 8px}
.eyebrow{margin:0 0 6px;font-size:12px;font-weight:700;letter-spacing:.08em;text-transform:uppercase;color:var(--muted)}
h1{font-size:clamp(24px,5vw,32px);line-height:1.2;margin:0 0 8px;letter-spacing:-.02em;text-wrap:balance}
.lede{margin:0;color:var(--muted);max-width:60ch}
.search{margin:16px 0 8px}
.search input{width:100%}
.group{margin:22px 0}
.group h2{font-size:14px;letter-spacing:.06em;text-transform:uppercase;margin:0 0 10px;color:var(--tc,var(--muted));display:flex;align-items:center;gap:8px}
.group h2::before{content:"";width:10px;height:10px;border-radius:3px;background:var(--tc,var(--muted))}
.tag-light{--tc:var(--light)} .tag-elec{--tc:var(--elec)} .tag-table{--tc:var(--table)} .tag-name{--tc:var(--name)} .tag-bond{--tc:var(--bond)}
.opts{display:grid;gap:8px}
.opt{display:grid;grid-template-columns:1fr auto;grid-template-areas:"t c" "h c";align-items:center;gap:2px 12px;padding:13px 16px;border:1px solid var(--line);border-left:4px solid var(--tc,var(--accent));background:var(--card);border-radius:12px;text-decoration:none;color:var(--ink);box-shadow:var(--shadow);transition:transform .08s,border-color .15s}
.opt:hover{border-color:var(--tc,var(--accent));transform:translateY(-1px)}
.opt:focus-visible{outline:3px solid var(--accent-soft);outline-offset:2px}
.opt-t{grid-area:t;font-weight:600}
.opt-h{grid-area:h;font-size:13px;color:var(--muted)}
.chev{grid-area:c;color:var(--tc,var(--accent));font-weight:700}
.trail{display:flex;flex-wrap:wrap;align-items:center;gap:4px 6px;font-size:13px;margin:4px 0 14px}
.crumb{text-decoration:none;padding:3px 10px;border-radius:999px;background:var(--soft);color:var(--ink);max-width:100%;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
a.crumb:hover{background:var(--accent-soft)}
.crumb.here{background:var(--accent);color:#fff}
.crumb.muted{background:transparent;color:var(--tc);font-weight:700;padding:3px 2px}
.sep{color:var(--muted)}
.card{background:var(--card);border:1px solid var(--line);border-radius:var(--radius);padding:20px;box-shadow:var(--shadow);margin-bottom:16px}
.node{border-top:5px solid var(--tc,var(--accent))}
.steps{margin:10px 0 0;padding-left:22px}
.steps li{margin:8px 0;padding-left:4px}
.watch{margin-top:16px;background:var(--warn-bg);color:var(--warn-ink);border-radius:10px;padding:12px 14px}
.watch strong{display:block;font-size:12px;letter-spacing:.06em;text-transform:uppercase;margin-bottom:4px}
.watch p{margin:4px 0}
.notes-link{margin:14px 0 0;font-size:14px}
.verdict{display:inline-block;font-weight:800;letter-spacing:.06em;padding:4px 12px;border-radius:8px;margin:0 0 6px}
.v-polar{color:var(--bad)} .verdict.v-polar{background:var(--bad-bg)}
.v-non{color:var(--ok)} .verdict.v-non{background:var(--ok-bg)}
.navrow{display:flex;gap:8px;flex-wrap:wrap}
.tool .eyebrow{color:var(--accent)}
.field{display:flex;flex-direction:column;gap:4px;font-size:13px;color:var(--muted);min-width:0}
.field span{font-weight:600}
input,select,textarea{font:inherit;font-size:16px;color:var(--ink);background:var(--bg);border:1px solid var(--line);border-radius:10px;padding:10px 12px;min-width:0;width:100%}
textarea{resize:vertical}
input:focus,select:focus,textarea:focus{outline:none;border-color:var(--accent);box-shadow:0 0 0 3px var(--accent-soft)}
input[readonly]{background:var(--soft)}
.grid2,.grid3,.grid4{display:grid;gap:10px;margin-bottom:8px}
.grid2{grid-template-columns:repeat(auto-fit,minmax(200px,1fr))}
.grid3{grid-template-columns:repeat(auto-fit,minmax(150px,1fr))}
.grid4{grid-template-columns:repeat(auto-fit,minmax(130px,1fr))}
fieldset.side{border:1px solid var(--line);border-radius:12px;padding:10px 12px 12px;margin:0;display:grid;gap:8px}
legend{font-size:13px;font-weight:700;color:var(--muted);padding:0 4px}
.hint{font-size:13px;color:var(--muted);margin:6px 0}
.center{text-align:center}
.res{margin-top:12px;border:1px solid var(--line);border-radius:12px;padding:14px 16px;background:var(--bg)}
.res p{margin:8px 0}
.res-ok{border-color:color-mix(in srgb,var(--ok) 40%,var(--line))}
.res-bad{border-color:color-mix(in srgb,var(--bad) 45%,var(--line));background:var(--bad-bg);color:var(--bad)}
.ans{display:flex;flex-direction:column;gap:2px;margin-bottom:6px}
.ans-l{font-size:13px;font-weight:700;color:var(--muted)}
.ans-v{font-size:clamp(20px,4.5vw,26px);font-weight:700;letter-spacing:-.01em;line-height:1.25;word-break:break-word}
.ans-s{font-size:13px;color:var(--muted)}
.duo{display:grid;grid-template-columns:repeat(auto-fit,minmax(150px,1fr));gap:12px}
.duo .ans{background:var(--card);border:1px solid var(--line);border-radius:10px;padding:10px 12px}
.why{margin:6px 0;padding-left:20px}
.why li{margin:5px 0}
.checks{list-style:none;padding:0;margin:8px 0}
.checks li{padding:6px 10px;border-radius:8px;margin:4px 0}
.checks .pass{background:var(--ok-bg);color:var(--ok)}
.checks .fail{background:var(--bad-bg);color:var(--bad);font-weight:600}
.res-bad .checks .pass{color:var(--ok)}
.lbl{font-size:12px;font-weight:700;letter-spacing:.06em;text-transform:uppercase;color:var(--muted);margin:14px 0 6px!important}
.stats{display:flex;flex-wrap:wrap;gap:6px;margin:8px 0}
.stats span{background:var(--card);border:1px solid var(--line);border-radius:8px;padding:5px 10px;font-size:14px}
.chips{display:flex;flex-wrap:wrap;gap:6px;margin:8px 0}
.chip{font:inherit;font-size:13px;border:1px solid var(--line);background:var(--card);color:var(--ink);border-radius:999px;padding:4px 11px;cursor:pointer}
button.chip:hover{border-color:var(--accent)}
.chip.static{cursor:default;font-size:15px;font-weight:600}
.chip.pri{background:var(--accent);color:#fff;border-color:var(--accent)}
.seg{display:inline-flex;border:1px solid var(--line);border-radius:999px;padding:3px;margin-bottom:10px;background:var(--bg);flex-wrap:wrap}
.seg button{font:inherit;font-size:14px;border:0;background:transparent;color:var(--muted);padding:6px 12px;border-radius:999px;cursor:pointer}
.seg button.on{background:var(--card);color:var(--ink);box-shadow:var(--shadow);font-weight:600;outline:1px solid var(--line)}
.orbs{display:flex;flex-wrap:wrap;gap:14px;margin:4px 0}
.orb{display:flex;flex-direction:column;align-items:center}
.boxes{display:flex}
.bx{width:34px;height:34px;border:1.5px solid var(--ink);display:grid;place-items:center;font-size:17px;letter-spacing:-2px;margin-left:-1.5px;background:var(--card)}
.bx:first-child{margin-left:0}
.orb-l{font-size:13px;margin-top:3px;color:var(--muted);font-weight:600}
.full{font-size:14px;color:var(--muted);word-break:break-word}
.cmp{font-weight:600;padding:6px 10px;border-radius:8px}
.cmp-ok{background:var(--ok-bg);color:var(--ok)} .cmp-bad{background:var(--bad-bg);color:var(--bad)}
.rankline{font-size:clamp(18px,4vw,22px);font-weight:700}
.rankline span{color:var(--muted);font-weight:400;margin:0 4px}
.twocol{display:grid;grid-template-columns:repeat(auto-fit,minmax(200px,1fr));gap:12px}
.rank{margin:4px 0;padding-left:0;list-style:none}
.spectrum{display:flex;flex-wrap:wrap;gap:4px;margin-top:10px}
.spectrum span{font-size:12px;padding:3px 8px;border-radius:6px;background:var(--soft);color:var(--muted)}
.spectrum span.on{background:var(--accent);color:#fff;font-weight:700}
.lewisbox{background:var(--card);border:1px solid var(--line);border-radius:12px;padding:8px}
svg.lewis{display:block;width:100%;max-width:340px;max-height:280px;margin:0 auto;color:var(--ink)}
svg.lewis line{stroke:currentColor;stroke-width:2;stroke-linecap:round}
svg.lewis .at{font:600 16px system-ui,sans-serif;fill:currentColor}
svg.lewis .dot{fill:currentColor}
svg.lewis .fc{font:700 10px system-ui,sans-serif;fill:var(--accent)}
svg.lewis .br{fill:none;stroke:currentColor;stroke-width:1.6}
svg.lewis .chg{font:600 13px system-ui,sans-serif;fill:currentColor}
.dotwrap{display:flex;gap:16px;align-items:center;flex-wrap:wrap}
.dotsvg{width:120px;height:120px;color:var(--ink);background:var(--card);border:1px solid var(--line);border-radius:12px}
.geo{margin-top:6px}
hr{border:0;border-top:1px solid var(--line);margin:18px 0}
.notes section{border-top:1px solid var(--line);padding-top:6px;margin-top:10px;scroll-margin-top:70px;border-radius:8px}
.notes h3{font-size:16px;margin:8px 0 4px}
.notes ul{margin:4px 0 8px;padding-left:20px}
.notes li{margin:3px 0}
.notes section.flash{animation:flash 2s ease}
@keyframes flash{0%,40%{background:var(--accent-soft)}100%{background:transparent}}

.btn.primary{background:var(--accent);border-color:var(--accent);color:#fff;font-weight:600}
.btn.primary:hover{filter:brightness(1.08)}
.btn.small{padding:4px 10px;font-size:13px}
.dim{color:var(--muted);font-weight:400}
.mono{font-family:var(--mono)}
.drillcta{display:flex;align-items:center;justify-content:space-between;gap:12px;margin:14px 0 4px;padding:14px 16px;border-radius:12px;background:var(--accent);color:#fff;text-decoration:none;box-shadow:var(--shadow)}
.drillcta b{display:block;font-size:17px}
.drillcta small{display:block;opacity:.9;font-size:13px}
.drillcta .chev{color:#fff}
.drillgrid{display:grid;gap:14px;grid-template-columns:repeat(auto-fit,minmax(300px,1fr));margin-top:10px}
.dcard{border-top:5px solid var(--tc);display:flex;flex-direction:column;gap:6px;margin:0}
.dcard h2{font-size:18px;margin:0 0 6px}
.dcard .btn.primary{align-self:flex-start;margin-top:10px}
.dcard .seg{display:grid;grid-template-columns:repeat(3,1fr);border-radius:12px;width:100%}
.dcard .seg button{border-radius:9px;font-size:13px;padding:7px 6px;line-height:1.25}
.togs{display:grid;gap:6px}
.togs.inline{grid-template-columns:repeat(auto-fit,minmax(150px,1fr))}
.tog{display:flex;align-items:flex-start;gap:10px;padding:8px 10px;border:1px solid var(--line);border-radius:10px;cursor:pointer;background:var(--bg)}
.tog input{width:18px;height:18px;margin:2px 0 0;accent-color:var(--accent);flex:none}
.tog span{font-size:14px;font-weight:600;color:var(--ink)}
.tog small{display:block;font-weight:400;color:var(--muted);font-size:12px}
.ref summary{cursor:pointer;font-weight:600}
.refc{display:grid;gap:10px;margin-top:10px;grid-template-columns:repeat(auto-fit,minmax(220px,1fr))}
.refrow{border:1px solid var(--line);border-radius:10px;padding:8px 12px;background:var(--bg)}
.refrow p{margin:0 0 4px}
.refrow ul{margin:0;padding-left:18px;font-size:14px}
.scorebar{display:flex;flex-wrap:wrap;align-items:center;gap:6px 14px;margin:0 0 12px;font-size:14px}
.scorebar .btn{margin-left:auto}
.dq{border-top:5px solid var(--accent)}
.again{color:var(--bad)}
.qprompt{font-size:15px;color:var(--muted);margin:0 0 4px;font-weight:600}
.qbig{font-size:clamp(26px,7vw,40px);font-weight:700;letter-spacing:-.01em;line-height:1.2;margin:2px 0 6px;word-break:break-word}
.qbig.mono{font-family:inherit}
.mc{display:grid;gap:8px;margin-top:14px;grid-template-columns:repeat(auto-fit,minmax(170px,1fr))}
.mc button{font:inherit;font-size:15px;text-align:left;display:flex;gap:10px;align-items:center;padding:11px 12px;border:1px solid var(--line);border-radius:10px;background:var(--bg);color:var(--ink);cursor:pointer;min-height:48px}
.mc button:hover:not(:disabled){border-color:var(--accent)}
.mc button .k{flex:none;width:22px;height:22px;border-radius:6px;display:grid;place-items:center;font-size:12px;font-weight:700;background:var(--soft);color:var(--muted)}
.mc button:disabled{cursor:default;opacity:.55}
.mc button.right{opacity:1;border-color:var(--ok);background:var(--ok-bg);color:var(--ok);font-weight:700}
.mc button.wrong{opacity:1;border-color:var(--bad);background:var(--bad-bg);color:var(--bad);font-weight:700}
.ta{display:flex;gap:8px;flex-wrap:wrap;margin-top:14px}
.ta input{flex:1 1 220px;font-size:18px}
.ta input.ok{border-color:var(--ok);background:var(--ok-bg)}
.ta input.bad{border-color:var(--bad);background:var(--bad-bg)}
.ansv{font-size:18px}
#nextq{margin-top:6px}
.kbd{display:none}
@media (pointer:fine){.kbd{display:inline}}
.lwd summary{cursor:pointer;font-size:14px;color:var(--accent);margin:6px 0}
@media (max-width:520px){ header.top nav .btn{padding:6px 10px;font-size:13px} .mc{grid-template-columns:1fr 1fr} .mc button{font-size:14px;padding:10px} }
footer{max-width:820px;margin:0 auto;padding:0 16px 30px;color:var(--muted);font-size:13px}
@media (max-width:520px){
  .card{padding:16px}
  header.top .brand .full-name{display:none}
  .crumb{max-width:78vw}
}
@media (prefers-reduced-motion: reduce){ .opt{transition:none} .notes section.flash{animation:none} }
</style>

    q: 'Does the problem give or ask for ENERGY (E)?', opts: ['light_Ev', 'light_El', 'light_c'] },
  light_Ev: { title: 'Yes — energy with frequency (ν / Hz)', notes: 'light',
    steps: ['E and ν → use <b>E = hν</b> (h = 6.626 × 10<sup>−34</sup> J·s).', 'Units going IN: ν must be in Hz (s<sup>−1</sup>); E must be in J. Convert kJ → J (× 1000) first.', 'Solving for ν? Rearrange: <b>ν = E / h</b>.', 'The answer comes OUT in J (or Hz). If the question wants kJ, divide by 1000 at the end.', 'Sig figs match your given value (h has 4). Write it in scientific notation.'],
    watch: ['Read the unit the question asks for (J vs kJ) — HW 7 #9 and #10 were marked wrong for answering in J when kJ was asked.'],
    tool: 'light', preset: { given: 'nu', gUnit: 'Hz (s⁻¹)', find: 'E', fUnit: 'J', value: '8.6x10^8' } },
  light_El: { title: 'Yes — energy with wavelength (λ)', notes: 'light',
    steps: ['E and λ → use <b>E = hc / λ</b>.', 'λ must be in <b>meters</b>. nm → m: × 10<sup>−9</sup>. cm → m: × 10<sup>−2</sup>.', 'Solving for λ? Rearrange: <b>λ = hc / E</b> (comes out in m; convert to nm by × 10<sup>9</sup> if asked).', 'Energy always comes out in <b>J</b>.', 'Sig figs: match the given value (c has 3).'],
    watch: ['Quiz 3 #5: 2.73 × 10<sup>−2</sup> nm has to become 2.73 × 10<sup>−11</sup> m BEFORE plugging in. The answer is 7.28 × 10<sup>−15</sup> <b>J</b>, not Hz.'],
    tool: 'light', preset: { given: 'lambda', gUnit: 'nm', find: 'E', fUnit: 'J', value: '2.73x10^-2' } },
  light_c: { title: 'No — only wavelength and frequency', notes: 'light',
    steps: ['No E anywhere → use <b>λν = c</b> (c = 3.00 × 10<sup>8</sup> m/s).', 'ν = c / λ, or λ = c / ν.', 'λ must be in <b>m</b> and ν in <b>Hz</b> going in. Convert nm/cm first.', 'Wavelength answers come out in m — convert to nm or cm if the question asks.', 'Sig figs: match the given value (max 3 because of c).'],
    watch: ['HW 7 #6: a frequency → wavelength in <b>cm</b> needs the last conversion step (m → cm, × 100).'],
    tool: 'light', preset: { given: 'lambda', gUnit: 'm', find: 'nu', fUnit: 'Hz (s⁻¹)', value: '3.40x10^-9' } },
  light_compare: { title: 'Compare waves (high/low energy, frequency, wavelength)', hint: 'radio → gamma', notes: 'light',
    steps: ['Spectrum from LOW to HIGH energy: radio → microwave → infrared → visible (red ~700 nm → violet ~400 nm) → UV → X-ray → gamma.', 'High energy = high frequency = <b>short</b> wavelength. They move together; wavelength goes the opposite way.', 'Comparing two numbers? Look at the exponent first: 10<sup>−9</sup> is tiny, 10<sup>5</sup> is big.', 'Amplitude is the wave height (brightness), not the energy of each photon.'],
    watch: ['HW 7 #1: 1.0 × 10<sup>−9</sup> Hz is a LOW frequency compared to 1.0 × 10<sup>5</sup> Hz — negative exponents are small.'],
    tool: 'spectrum' },
  trans: { title: 'Electron jumps: absorption vs. emission, rank by energy or wavelength', hint: 'e.g. 6→2 vs 6→5', notes: 'bohr',
    steps: ['<b>Emission</b> = electron drops, high n → low n (energy released). <b>Absorption</b> = low n → high n.', 'Levels get CLOSER together as n grows, so jumps that land on n = 1 are the biggest.', 'Bigger jump = more energy = higher frequency = <b>shorter</b> wavelength.', 'Longest wavelength = the smallest jump (like 4→3 or 6→5).', 'If asked for the energy of a level in hydrogen: E<sub>n</sub> = −2.18 × 10<sup>−18</sup> J / n².'],
    watch: ['"4→3" and "3→4" are the same size jump — one is emission, the other absorption.'],
    tool: 'trans' },
  bohr: { title: 'True/false on Bohr, the quantum model, and spectra', notes: 'bohr',
    steps: ['Bohr: electrons move in fixed orbits with quantized energies; jumps have no in-between.', 'Quantum model: electrons are wave AND particle. Orbitals are probability regions — electrons stay IN a shape, they don\'t follow an exact path.', 'Heisenberg: you can\'t know an electron\'s exact position and speed at the same time → that\'s why we use orbitals.', 'Heated gas → <b>line</b> (discrete) spectrum. White light / rainbow → <b>continuous</b> spectrum.', 'Hydrogen has one electron, so it\'s the simplest system to study.', 'Brightness comes from how many atoms are emitting, not from each photon\'s energy.', 'An electron given so much energy that it leaves the atom = ionization.'],
    watch: ['"Orbit" = Bohr path. "Orbital" = quantum probability region. Don\'t swap them.'] },

  /* ---------- ELECTRONS ---------- */
  qn: { title: 'Quantum numbers: allowed set? how many orbitals or electrons? does it exist?', hint: 'n, ℓ, mℓ, ms · 3p · 2f', q: 'Which kind of quantum-number question is it?', opts: ['qn_set', 'qn_count'] },
  qn_set: { title: 'Is this set of 4 numbers (n, ℓ, mℓ, ms) allowed?', notes: 'qn',
    steps: ['n = 1, 2, 3… — never 0.', 'ℓ = 0 up to n − 1 (s = 0, p = 1, d = 2, f = 3). ℓ can never equal n.', 'mℓ = any whole number from −ℓ to +ℓ.', 'ms = +½ or −½ only.', 'These questions always have exactly one number that breaks a rule — check each one.'],
    tool: 'qnset' },
  qn_count: { title: 'How many orbitals/electrons? Does this subshell exist?', notes: 'qn',
    steps: ['FIRST decide: is it asking for <b>ORBITALS</b> or <b>ELECTRONS</b>? Read it twice.', 's = 1 orbital / 2 e⁻ · p = 3 / 6 · d = 5 / 10 · f = 7 / 14.', 'Any single orbital holds at most 2 electrons (e.g. "electrons in a 3d orbital" = 2).', 'Subshells that exist: 1s | 2s 2p | 3s 3p 3d | 4+ all four. 1p, 2d, 1f, 2f, 3f don\'t exist → "0 = not possible".', 'A whole shell n: n² orbitals and 2n² electrons (2, 8, 18, 32).'],
    watch: ['Quiz 3 #10: "orbitals in a 3p subshell" = 3 (not 6) and "orbitals in a 4d subshell" = 5 (not 10).'],
    tool: 'subshell' },
  config: { title: 'Write an electron configuration (atom or ion)', hint: '[Ar] 4s² 3d³', q: 'Is it a neutral atom, a positive ion, or a negative ion?', opts: ['config_atom', 'config_cation', 'config_anion'] },
  config_atom: { title: 'Neutral atom', notes: 'config',
    steps: ['Find the element. Read the periodic table left → right, top → bottom, filling as you go.', 'Row number = n for s and p. The d block is one row behind: <b>d = row − 1</b> (4s then 3d).', 'The superscript is the TOTAL in that subshell (2p⁶, not 2p¹ 2p¹…).', 'Shortcut: in the d block, the ones digit of the atomic number = number of d electrons (Co 27 → d⁷, Zn 30 → d¹⁰).', 'Exceptions (d⁴ and d⁹): <b>Cr, Mo, W → ns¹ (n−1)d⁵</b>; <b>Cu, Ag, Au → ns¹ (n−1)d¹⁰</b>.', 'Noble-gas shorthand: bracket the noble gas before it ([He], [Ne], [Ar], [Kr], [Xe]) and write the rest.'],
    tool: 'config', preset: { sp: 'Mn' } },
  config_cation: { title: 'Positive ion (cation)', notes: 'config',
    steps: ['Write the NEUTRAL atom first (including any exception).', 'Remove electrons from the <b>highest n</b> first. <b>4s leaves before 3d.</b> For p-block metals: take p, then s.', 'Never write a ⁰ superscript — just drop that subshell.', 'Then check: total electrons = atomic number − charge.'],
    watch: ['Quiz 3 #1: V⁺ is [Ar] 4s¹ 3d³ — the electron comes out of 4s, not 3d. ([Ar] 4s² 3d² was marked wrong.)'],
    tool: 'config', preset: { sp: 'V+' } },
  config_anion: { title: 'Negative ion (anion)', notes: 'config',
    steps: ['Write the NEUTRAL atom first.', 'ADD one electron per negative charge into the next open spots (usually the p subshell).', 'Nonmetals usually end up with a noble-gas configuration (Cl⁻ = [Ar]).', 'Check: total electrons = atomic number + |charge|.'],
    tool: 'config', preset: { sp: 'P2-' } },
  identify: { title: 'Identify the atom or ion from a configuration or orbital diagram', hint: 'which ion has 5s⁰ 4d⁹?', notes: 'config',
    steps: ['Count the electrons shown. A "valence level" diagram leaves out the core — add the noble gas before it.', 'Neutral atom? Total electrons = atomic number → that\'s the element.', 'Ion? Electrons ≠ protons. Test each answer choice: write its neutral config, then add/remove electrons (highest n leaves first).', 'An EMPTY s box with d electrons usually means a transition-metal cation (the s electrons left first).', 'Several ions can share a configuration — the tool lists them all; pick the one that\'s in your choices.'],
    tool: 'identify' },
  config_count: { title: 'Unpaired electrons, para/diamagnetic, electrons in s/p orbitals, valence e⁻', hint: 'Hund\'s rule counting', notes: 'config',
    steps: ['Write the configuration (use the config tool below).', 'Draw boxes for the last subshells. Hund: one arrow per box first, then pair (↑↓).', 'Any unpaired electron → <b>paramagnetic</b>. All paired → <b>diamagnetic</b>. Shortcut for neutral atoms: end of a block (He, column 2, column 12, noble gases) is diamagnetic.', 'Valence electrons = ALL electrons in the highest n. Core = everything else.', 'Electrons in "all s orbitals": add every s superscript — watch exceptions (Cu has 4s¹ → 1s²+2s²+3s²+4s¹ = 7).'],
    watch: ['Quiz 3 #6: K is 4s¹ → one unpaired → paramagnetic, NOT diamagnetic.'],
    tool: 'config', preset: { sp: 'Br+' } },
  iso: { title: 'Isoelectronic? (same number of electrons)', notes: 'config',
    steps: ['Electrons = atomic number − charge (a + charge removes electrons, a − charge adds them).', 'Same electron count = isoelectronic.', 'Example family (10 e⁻): N³⁻, O²⁻, F⁻, Ne, Na⁺, Mg²⁺.', 'Bonus (size): in an isoelectronic set, more protons → smaller.'],
    watch: ['Quiz 3 #6: F⁺ (8 e⁻) vs Mg²⁻ (14 e⁻) → FALSE. Spell TRUE/FALSE carefully ("FASLE" was marked wrong).'],
    tool: 'iso' },

  /* ---------- TABLE & TRENDS ---------- */
  classify: { title: 'Classify an element (family, metal/nonmetal, block, period, state)', hint: 'Ca → alkaline earth metal', notes: 'table',
    steps: ['Column = group/family (has a name). Row = period (has a number).', 'Column 1 alkali metals (not H) · 2 alkaline earth · 3–12 transition metals · 17 halogens · 18 noble/inert gases · bottom rows lanthanides/actinides (inner transition).', 'Stair step: metals on the left, nonmetals on the right (+ H). Metalloids sit on the step: B, Si, Ge, As, Sb, Te.', 'Blocks: s = columns 1–2 (+He), p = 13–18, d = 3–12, f = the bottom rows.', 'Same column → similar properties.', 'Gases: H, N, O, F, Cl, noble gases. Liquids: Br, Hg. Everything else is solid.'],
    watch: ['Calcium is NOT a transition metal (column 2). Air is not an element.'],
    tool: 'element' },
  letters: { title: 'Mystery-letter periodic chart questions', hint: 'letters placed on a blank chart', notes: 'table',
    steps: ['Find the letter\'s row (period) and column (group).', 'Name its family from the column (1 alkali, 2 alkaline earth, 3–12 transition, 17 halogen, 18 noble gas) and its block (s, p, d).', 'Left of the stair step = metal; right = nonmetal.', 'For "largest/smallest/highest" questions, apply the trend directions to the positions — the letters act like real elements in those spots.', 'Diamagnetic spots: end of a block → column 2, column 12, column 18 (and He).'],
    watch: ['"D is an alkali earth metal" — D sat in column 1 (alkali), so FALSE. Read the column carefully.'],
    tool: 'element', preset: { mode: 'pos' } },
  trends: { title: 'Rank or compare size, ionization energy, electron affinity, electronegativity', hint: 'the "E / F" rule', q: 'Which property is the question about?', opts: ['trend_size', 'trend_ie', 'trend_ea', 'trend_en'] },
  trend_size: { title: 'Size (atomic or ionic radius)', notes: 'trends',
    steps: ['No "E" in "radius" → increases <b>AWAY from F</b>: down and to the left (Cs/Fr are biggest).', 'Down a column is a stronger change than across a row. If it\'s close, count blocks to Cs.', 'Same element: anion > neutral atom > cation ("cats are cute and small").', 'Isoelectronic set: more protons pull harder → smaller (P³⁻ > Cl⁻ > K⁺ > Ca²⁺).'],
    watch: ['Quiz 4 #7: O²⁺ and C both have 6 e⁻, but O has more protons → O²⁺ is smaller, not the same size.'],
    tool: 'trend', preset: { prop: 'size', list: 'Se, Cl-, Br, Se2-, Cl' } },
  trend_ie: { title: 'Ionization energy (cost to remove an electron)', notes: 'trends',
    steps: ['"E" in the name → increases <b>TOWARD F</b> (up and to the right). He is the highest.', 'Noble gases <b>DO</b> count for ionization energy.', 'Exception: <b>O &lt; N</b> (N is half-filled). The same flip happens down those two columns.', '2nd IE (removing from a +1 ion) is always bigger than the 1st.'],
    watch: ['Quiz 4 #15: highest IE among Mg, F, Si, S, Ne is <b>Ne</b> — noble gases count here.'],
    tool: 'trend', preset: { prop: 'IE', list: 'Mg, F, Si, S, Ne' } },
  trend_ea: { title: 'Electron affinity (desire to gain an electron)', notes: 'trends',
    steps: ['"E" in the name → increases <b>TOWARD F</b> (up and right). Lowest is bottom-left.', 'Think absolute value — ignore the + and − signs.', 'Leave out the noble gases.', 'Exception: <b>C &gt; N</b> (N would lose its half-filled p³).'],
    watch: ['Quiz 4 #10: lowest EA among S, C, Si, F, Mg is Mg — farthest from F.'],
    tool: 'trend', preset: { prop: 'EA', list: 'S, C, Si, F, Mg' } },
  trend_en: { title: 'Electronegativity (pull on shared electrons)', notes: 'trends',
    steps: ['"E" in the name → increases <b>TOWARD F</b>. F is the highest (4.0).', 'Leave out the noble gases.', 'Up beats sideways: O is more electronegative than Cl.'],
    tool: 'trend', preset: { prop: 'EN', list: 'Ga, P, As, Ge' } },

  /* ---------- NAMING ---------- */
  name: { title: 'Name a compound from its formula', hint: 'Fe2O3 → iron (III) oxide', q: 'Look at the START of the formula. What is it?', opts: ['name_acid', 'name_fixed', 'name_tm', 'name_cov'] },
  name_acid: { title: 'Starts with H (an acid)', notes: 'naming',
    steps: ['H written first (or the word "acid") → acid naming.', 'H + ONE element (no oxygen): <b>hydro</b> + root + <b>ic acid</b> (HCl → hydrochloric acid; HCN → hydrocyanic acid).', 'H + a polyatomic ion: <b>-ate → -ic acid</b>, <b>-ite → -ous acid</b>, and NO "hydro" (HClO₃ chlorate → chloric acid; HClO₂ chlorite → chlorous acid).', 'Don\'t write (aq) in the name.'],
    tool: 'name', preset: { f: 'HClO2' } },
  name_fixed: { title: 'A metal from column 1, column 2, Al — or NH₄⁺', notes: 'naming',
    steps: ['Write the metal\'s name exactly (these charges never change: col 1 = +1, col 2 = +2, Al = +3).', 'Second word: one element → root + <b>ide</b> (chloride, oxide, phosphide). A polyatomic ion → copy its name from the chart (no -ide).', 'NO Roman numerals and NO prefixes.', 'Spelling counts — fluorine has a "u" before the "o"; potassium, not "potassiym".'],
    watch: ['Quiz 4 #4: K₂CO₃ = potassium carbonate — the only miss was a typo.'],
    tool: 'name', preset: { f: 'K2CO3' } },
  name_tm: { title: 'A transition (middle-of-table) metal', notes: 'naming',
    steps: ['These metals can have different charges → the name needs a <b>Roman numeral</b> = the metal\'s charge.', 'Find the charge from the anion: (anion charge × number of anions) ÷ number of metals. Example Ti₂O₃: 2x − 6 = 0 → x = 3 → titanium (III) oxide.', 'Use capital I\'s (III), not lowercase L\'s.', 'Second word is the same as usual (-ide or the polyatomic name). NEVER prefixes.'],
    tool: 'name', preset: { f: 'Cr2(SO4)3' } },
  name_cov: { title: 'A nonmetal (two nonmetals → covalent)', notes: 'naming',
    steps: ['Both elements are nonmetals → covalent → use prefixes on both.', 'Prefixes: mono, di, tri, tetra, penta, hexa, hepta, octa, nona, deca.', 'NEVER "mono" on the first element — but ALWAYS use it on the second (carbon monoxide).', 'Second word ends in -ide. Drop the a/o before "oxide" (pentoxide, monoxide).', 'No Roman numerals, ever.'],
    tool: 'name', preset: { f: 'P2O5' } },
  formula: { title: 'Write a formula from a name', hint: 'magnesium nitrate → Mg(NO₃)₂', q: 'What kind of name is it?', opts: ['formula_acid', 'formula_fixed', 'formula_tm', 'formula_cov'] },
  formula_acid: { title: 'It ends in "acid"', notes: 'naming',
    steps: ['hydro___ic acid → H + one element (hydrochloric → HCl).', '___ic acid (no hydro) → the -ate ion; ___ous acid → the -ite ion.', 'Number of H = size of the anion\'s charge (sulfate −2 → H₂SO₄).'],
    tool: 'formula', preset: { n: 'sulfuric acid' } },
  formula_fixed: { title: 'Metal with no Roman numeral (col 1, col 2, Al, ammonium)', notes: 'naming',
    steps: ['Charges: col 1 = +1, col 2 = +2, Al = +3, ammonium NH₄⁺ = +1.', 'Anion charge: N-column −3, O-column −2, halogens −1, or read the polyatomic ion from the chart.', 'Cross and drop the charges, then <b>reduce</b> to the lowest ratio.', 'More than one polyatomic ion → parentheses: Mg(NO₃)₂.', 'Element symbols are a capital + lowercase letter: Li, not LI.'],
    watch: ['Quiz 4 #3: lithium phosphite = Li₃PO₃ — typing "LI" cost the point.'],
    tool: 'formula', preset: { n: 'lithium phosphite' } },
  formula_tm: { title: 'Metal with a Roman numeral', notes: 'naming',
    steps: ['The Roman numeral IS the metal\'s charge: iron (III) → Fe³⁺.', 'Get the anion\'s charge (O²⁻, Cl⁻, or from the polyatomic chart).', 'Cross and drop, then reduce: Fe³⁺ + O²⁻ → Fe₂O₃. Ti⁴⁺ + O²⁻ → Ti₂O₄ → TiO₂.', 'Parentheses only when there is more than one polyatomic ion.'],
    tool: 'formula', preset: { n: 'iron (III) oxide' } },
  formula_cov: { title: 'It has prefixes (two nonmetals)', notes: 'naming',
    steps: ['The prefixes ARE the subscripts: dinitrogen pentoxide → N₂O₅.', 'No prefix on the first element = 1.', 'Do NOT reduce covalent formulas and do NOT use charges.'],
    tool: 'formula', preset: { n: 'dinitrogen pentoxide' } },
  ioncount: { title: 'How many ions combine? (X²⁺ + Y⁴⁻, cross and drop)', hint: 'total ions in the formula', notes: 'naming',
    steps: ['Write each charge above its ion.', 'Cross and drop: each ion\'s charge becomes the OTHER ion\'s subscript.', 'Reduce to the lowest ratio (X₄Y₂ → X₂Y).', 'Total ions = the subscripts added together (a polyatomic ion counts as one ion).'],
    watch: ['Quiz 4 #1: X²⁺ + Y⁴⁻ → X₄Y₂ → reduce → X₂Y = <b>3</b> ions.'],
    tool: 'ioncount' },
  bondtype: { title: 'Ionic or covalent? What should the name look like?', notes: 'ionic',
    steps: ['Metal + nonmetal → <b>ionic</b>: electrons are transferred, + and − attract (Coulomb: bigger charges and smaller ions stick harder). Ionic compounds dissolve in water and conduct electricity.', 'Nonmetal + nonmetal → <b>covalent</b>: electrons are shared through orbital overlap. They don\'t dissolve in water or conduct.', 'H is odd: covalent with nonmetals, ionic with metals.', 'What the name looks like: col 1 / col 2 / Al → no numeral, no prefix; transition metal → Roman numeral, no prefix; two nonmetals → prefixes. Never both.'],
    watch: ['Quiz 4 #17: two nonmetals → covalent, so "generally ionic" is FALSE.'],
    tool: 'name', preset: { f: 'SeF4' } },

  /* ---------- BONDING ---------- */
  valence: { title: 'Count total valence electrons', hint: 'H₂PO₃⁻ → 26', notes: 'lewis',
    steps: ['Each atom: its tall-column count (1–8).', 'Multiply by how many of that atom there are.', 'Negative charge → ADD that many electrons. Positive charge → SUBTRACT.', 'An odd total is rare — recheck your count and the charge.'],
    watch: ['Quiz 4 #11: H₂PO₃⁻ = 2(1) + 5 + 3(6) + 1 = 26.'],
    tool: 'valence', preset: { f: 'H2PO3-' } },
  dot: { title: 'Dot symbol for one atom or ion (pairs vs. singles)', hint: 'S → 2 pairs + 2 singles', notes: 'lewis',
    steps: ['Number of dots = valence electrons (column count), adjusted for any charge.', 'Put ONE dot on each of the 4 sides first, then start pairing.', 'Stop at 8.', 'Ions go in [brackets] with the charge outside.'],
    watch: ['Quiz 4 #9: sulfur has 6 → 4 singles, then pair 2 of them → two pairs and two single electrons.'],
    tool: 'dot', preset: { sp: 'S' } },
  lewis: { title: 'Draw a Lewis structure / describe the central atom', hint: 'bonds + lone pairs', notes: 'lewis',
    steps: ['Count total valence electrons (add for −, subtract for +).', 'Least electronegative atom in the center (usually the first one written) — <b>never H</b>.', 'Draw single bonds to every outer atom (each line = 2 e⁻).', 'Give the <b>central atom 8 first</b>, then fill the outer atoms. Check your count matches the total.', 'Extra electrons → pairs on the central atom (only row 3+ can go over 8).', 'Short on electrons → slide lone pairs into double bonds, then triple.', 'Octet exceptions: H = 2 (one bond), Be = 4, B = 6. C, N, O, F are strictly 8.', 'Row-3+ central atoms: fix formal charge so the central atom is 0 (SO₂ → O=S=O).'],
    tool: 'lewis', preset: { f: 'SO3^2-' } },
  fc: { title: 'Formal charge, or pick the better structure', notes: 'lewis',
    steps: ['FC = valence − dots − lines (count each bond line once for that atom).', 'Best structure: formal charges as close to 0 as possible; any negative FC on the more electronegative atom.', 'The formal charges add up to the overall charge.', 'Row-3+ central atoms: make double bonds until the central atom\'s FC is 0 (SO₃²⁻ and PO₄³⁻ get one double bond; SO₂ gets two).'],
    watch: ['HW 11 #7 (COCl₂): the better structure is the one where every formal charge is 0.'],
    tool: 'fc' },
  resonance: { title: 'Does it have resonance?', notes: 'lewis',
    steps: ['Draw the structure with formal charge fixed first.', 'Could the double bond sit on a different, identical outer atom? → resonance.', 'Resonance: CO₃²⁻, SO₃²⁻, PO₄³⁻, NO₂⁻. No resonance: CO₂, SO₂ (after the FC fix), CH₂O, C₂H₂.'],
    tool: 'lewis', preset: { f: 'CO3^2-' } },
  shape: { title: 'Name the shape: electron geometry, molecular geometry, bond angle', hint: 'count regions', q: 'Which name or number is it asking for?', opts: ['shape_eg', 'shape_mg', 'shape_angle'] },
  shape_eg: { title: 'Electron geometry (the family name)', notes: 'shapes',
    steps: ['Draw the Lewis structure.', 'Count REGIONS on the central atom: each bonded atom = 1 (single, double, or triple bond all count as 1), each lone pair = 1.', '2 → linear · 3 → trigonal planar · 4 → tetrahedral · 5 → trigonal bipyramidal · 6 → octahedral.', 'Only these 5 names are possible for electron geometry. Lone pairs don\'t change it.'],
    tool: 'vsepr', preset: { f: 'BrF3' } },
  shape_mg: { title: 'Molecular geometry (the shape you see)', notes: 'shapes',
    steps: ['Start from the electron geometry (count regions).', 'No lone pairs → molecular name = electron name.', '3 regions: 1 LP → bent.', '4 regions: 1 LP → trigonal pyramidal; 2 LP → bent.', '5 regions (lone pairs go on the triangle): 1 LP → seesaw; 2 LP → T-shaped; 3 LP → linear.', '6 regions (lone pairs go opposite): 1 LP → square pyramidal; 2 LP → square planar.'],
    tool: 'vsepr', preset: { f: 'SF4' } },
  shape_angle: { title: 'Bond angle', notes: 'shapes',
    steps: ['Linear 180° · trigonal planar 120° · tetrahedral 109.5° · trigonal bipyramidal 90°, 120°, 180° · octahedral 90°, 180°.', 'Lone pairs on a trigonal planar or tetrahedral family squeeze the angle: pick "<b>&lt; 120°</b>" or "<b>&lt; 109.5°</b>".', 'Seesaw keeps 90/120/180. T-shaped loses the 120 (90, 180). Linear from 5 regions = 180 only.', 'Square pyramidal and square planar: 90° and 180°.'],
    watch: ['Tests list both "109.5°" and "< 109.5°" — bent and trigonal pyramidal get the "<" one.'],
    tool: 'vsepr', preset: { f: 'H2O' } },
  hyb: { title: 'Hybridization', hint: 'sp, sp², sp³, sp³d, sp³d²', notes: 'shapes',
    steps: ['Count regions on the atom asked about (bonded atoms + lone pairs; a double or triple bond still counts as 1).', 'Count the letters: s·p = 2 → sp; s·p·p = 3 → sp²; s·p·p·p = 4 → sp³; + d = 5 → sp³d; + d·d = 6 → sp³d².', 'Works for ANY atom, not just the center: a C=O oxygen has 1 bond + 2 lone pairs = 3 → sp².', 'A triple bond + one lone pair = 2 regions → sp (NOT sp³).'],
    tool: 'vsepr', preset: { f: 'PF5' } },
  polar: { title: 'Is the molecule polar or nonpolar?', hint: 'the class flowchart', q: 'Draw the Lewis structure first. Are ALL the outer atoms the same element?', opts: ['polar_diff', 'polar_q2', 'polar_tool'] },
  polar_diff: { title: 'No — the outer atoms are different', notes: 'polarity',

var NOTES_HTML = `
<section id="n-light"><h3>Light</h3><ul>
<li>c = λν · E = hν · E = hc/λ. h = 6.626×10⁻³⁴ J·s, c = 3.00×10⁸ m/s</li>
<li>E &amp; ν → E = hν · E &amp; λ → E = hc/λ · no E → λν = c</li>
<li>Units IN: λ in <b>m</b>, ν in <b>Hz (s⁻¹)</b>, E in <b>J</b>. Convert first (nm = 10⁻⁹ m, cm = 10⁻² m, kJ = 10³ J)</li>
<li>Answers need sig figs + scientific notation</li>
<li>Low → high E: radio → micro → IR → visible (red 700 nm → violet 400 nm) → UV → X-ray → gamma</li>
<li>High E = high ν = SHORT λ. Brightness = number of atoms, not energy</li></ul></section>
<section id="n-bohr"><h3>Bohr / quantum</h3><ul>
<li>Bohr: fixed orbits, quantized energies, jumps with no in-between</li>
<li>Quantum: wave AND particle; orbitals = probability regions; electrons stay IN shapes, not on paths</li>
<li>Heisenberg: can't know position and speed at once → orbitals</li>
<li>Heated gas = line spectrum · rainbow = continuous</li>
<li>Emission high n → low n (−E) · absorption low → high (+E) · electron knocked out = ionization energy</li>
<li>Levels get CLOSER as n rises. Bigger jump = more E, higher ν, shorter λ (4→1 biggest; 4→3 smallest; 4→3 &lt; 3→2 &lt; 2→1)</li>
<li>Hydrogen: Eₙ = −2.18×10⁻¹⁸ J / n²</li></ul></section>
<section id="n-qn"><h3>Quantum numbers</h3><ul>
<li>n = 1, 2, 3… (never 0) · ℓ = 0 to n−1 (s0 p1 d2 f3) · mℓ = −ℓ to +ℓ · ms = ±½ only</li>
<li>ℓ can never equal n: (4, 4, …) not allowed</li>
<li>Exist: 1s | 2s 2p | 3s 3p 3d | then all four. No 1p, 1d, 2d, 1f, 2f, 3f → "0 = not possible"</li>
<li><b>ORBITALS or ELECTRONS? read it twice.</b> s 1/2e · p 3/6e · d 5/10e · f 7/14e · any orbital max 2e</li>
<li>Max e per shell: n=1 → 2, 2 → 8, 3 → 18, 4 → 32 (2n²)</li></ul></section>
<section id="n-config"><h3>Configurations</h3><ul>
<li>Aufbau (build) lowest first · Pauli ↑↓ never ↑↑ · Hund (bus rule) one per box before pairing</li>
<li>Read table left → right, top → bottom. Row = n for s/p; d = row − 1. Blocks: s = cols 1–2 (+He), p right, d middle</li>
<li>Superscripts = TOTAL in that subshell</li>
<li>Order: 1s 2s 2p 3s 3p 4s 3d 4p 5s 4d 5p 6s 4f 5d 6p 7s</li>
<li>Ones-digit trick: ones digit of atomic # = number of d electrons (Sc 21 = d¹, Co 27 = d⁷, Zn 30 = d¹⁰)</li>
<li>Exceptions (d⁴/d⁹): Cr, Mo, W → ns¹(n−1)d⁵ · Cu, Ag, Au → ns¹(n−1)d¹⁰</li>
<li>Cations: remove from HIGHEST n first — <b>4s leaves before 3d</b>; p-block: p then s. No ⁰ superscripts. Anions: add</li>
<li>Valence = ALL e in highest n; core = the rest</li>
<li>Isoelectronic = same # of electrons (N³⁻, O²⁻, F⁻, Ne, Na⁺, Mg²⁺ = 10)</li>
<li>Paramagnetic = ≥1 unpaired · diamagnetic = all paired. Neutral end-of-block (He, col 2, col 12, noble gases) = dia</li></ul></section>
<section id="n-table"><h3>Periodic table</h3><ul>
<li>Column = group/family (named) · row = period (numbered)</li>
<li>1 alkali (not H) · 2 alkaline earth · middle transition (Ca is NOT) · 2nd from right halogens · right noble/inert gases · bottom rows inner transition</li>
<li>Metals left of stair step · nonmetals right (+H) · metalloids on step (B, Si, Ge, As, Sb, Te)</li>
<li>Same column → similar properties</li></ul></section>
<section id="n-trends"><h3>Trends — no E in the name → away from F; E in the name → toward F</h3><ul>
<li>Radius: bigger down and left (Cs/Fr biggest). Down beats across; count blocks to Cs if close</li>
<li>Cations smaller ("cats are small") · anions bigger · isoelectronic: more protons → smaller (P³⁻ &gt; Cl⁻ &gt; K⁺ &gt; Ca²⁺)</li>
<li>IE up and right, He highest, <b>noble gases count</b>. 1st &lt; 2nd &lt; 3rd. Exception <b>O &lt; N</b></li>
<li>EA up and right (absolute value). Exception <b>C &gt; N</b></li>
<li>EN up and right, F highest, O &gt; Cl. EA and EN leave out noble gases</li></ul></section>
<section id="n-ionic"><h3>Ionic vs. covalent</h3><ul>
<li>Ionic = metal + nonmetal: transfer, lattice, dissolves in water, conducts. Coulomb: bigger charges + smaller ions = stronger</li>
<li>Covalent = nonmetal + nonmetal: shared pair by orbital overlap; one lowest-energy distance. Doesn't dissolve/conduct</li>
<li>H is odd: covalent with nonmetals, ionic with metals</li>
<li>Charges: col 1 +1, col 2 +2, Al +3, skip C column, N col −3, O col −2, halogens −1, noble 0, transition varies</li>
<li>ΔEN &lt; 0.4 nonpolar · 0.4–1.8 polar · &gt; 1.8 ionic; more EN atom is δ⁻</li></ul></section>
<section id="n-naming"><h3>Formulas &amp; naming</h3><ul>
<li>Charges sum to 0, positive ion first. Cross and drop, then <b>reduce</b> (Ca₂S₂ → CaS). A 1 in the mix = already simplest</li>
<li>Polyatomic ions stay together; ( ) only if more than one: Ca(NO₃)₂</li>
<li>First element col 1/2/Al: name + root-ide. No numerals, no prefixes</li>
<li>Transition metal: name (Roman numeral) root-ide. Ti₂O₃: 2x − 6 = 0 → (III). Capital I, not lowercase L</li>
<li>Nonmetal first: prefixes on both. Never mono on the first; always on the second. Drop a/o before oxide</li>
<li>Never prefix + numeral together. Polyatomic: copy name from chart</li>
<li>Acids: hydro___ic = H + element (HCN hydrocyanic) · -ate → -ic · -ite → -ous (no hydro) · # H = charge · no (aq)</li>
<li>Spelling: fluorine, phosphorus. Symbols: capital + lowercase (Li, not LI)</li></ul></section>
<section id="n-lewis"><h3>Lewis structures</h3><ul>
<li>Valence = column count; +e⁻ for negative charge, −e⁻ for positive. Odd total → recheck</li>
<li>Atom dots: one per side, then pair, stop at 8. Ions in [brackets], charge outside</li>
<li>1 line = 2 e⁻. Single/double/triple = 2/4/6 e⁻</li>
<li>Steps: count → least EN atom central (first written, never H) → single bonds → center gets 8 first → outer atoms → check count</li>
<li>Extra e⁻ → pairs on central atom (row 3+ only). Short → slide lone pairs into double, then triple bonds</li>
<li>H = 2, Be = 4, B = 6. C, N, O, F strictly 8. Trick: 3 lone pairs + 1 line = 8</li>
<li>FC = valence − dots − lines. Closest to 0 wins; FCs sum to the charge</li>
<li>Resonance = double bond could sit in more than one spot (CO₃²⁻, SO₃²⁻, PO₄³⁻). Not CO₂, SO₂, CH₂O, C₂H₂</li>
<li>Diatomics: 14 dots → halogen; 12 → O₂/SO</li></ul></section>
<section id="n-shapes"><h3>Shapes (regions = bonded atoms + lone pairs)</h3><ul>
<li><b>2</b> linear, sp, 180°</li>
<li><b>3</b> trigonal planar, sp², 120° · 1 LP bent (&lt;120°)</li>
<li><b>4</b> tetrahedral, sp³, 109.5° · 1 LP trigonal pyramidal (&lt;109.5°) · 2 LP bent (&lt;109.5°)</li>
<li><b>5</b> trigonal bipyramidal, sp³d, 90/120/180° (LPs on triangle) · 1 LP seesaw (90/120/180) · 2 LP T-shaped (90/180) · 3 LP linear (180)</li>
<li><b>6</b> octahedral, sp³d², 90/180° (LPs opposite) · 1 LP square pyramidal · 2 LP square planar</li>
<li>Tetrahedral and octahedral are named for faces (4 and 8), not bonds</li>
<li>Hybridization = count letters in s·p·p·p·d·d</li></ul></section>
<section id="n-polarity"><h3>Polarity flowchart</h3><ul>
<li>Outer atoms all the same? No → polar</li>
<li>Yes → lone pairs on the center? No → nonpolar</li>
<li>Yes → linear or square planar? Yes → nonpolar · No → polar</li></ul></section>
<section id="n-sigpi"><h3>σ / π bonds</h3><ul>
<li>Every bond has exactly 1 σ (the framework). Double = 1σ + 1π. Triple = 1σ + 2π</li>
<li>σ = head-on between nuclei · π = side overlap above/below the axis</li>
<li>Length: single &gt; double &gt; triple · strength: triple &gt; double &gt; single</li>
<li>Valence bond theory: bonds form from overlap of half-filled orbitals</li></ul></section>`;

  if (set.mode !== 'shapes') {
    var dirs = set.dir === 'both' ? ['toName', 'toFormula'] : [set.dir];
    if (set.nFixed) gens.push(function () { return { t: 'name', f: genIonicFormula('fixed'), dir: rnd(dirs) }; });
    if (set.nTM) gens.push(function () { return { t: 'name', f: genIonicFormula('tm'), dir: rnd(dirs) }; });
    if (set.nCov) gens.push(function () { return { t: 'name', f: rnd(DR_COV), dir: rnd(dirs) }; });
    if (set.nAcid) gens.push(function () { return { t: 'name', f: rnd(DR_ACID), dir: rnd(dirs) }; });
  }
  if (set.mode !== 'naming') {
    var asks = Object.keys(ASK).filter(function (k) { return set.asks[k]; });
    if (!asks.length) asks = ['mg'];
    if (set.sRL) gens.push(function () { var c = rnd(DR_COMBOS); return { t: 'rl', r: c[0], l: c[1], ask: rnd(asks) }; });
    if (set.sRev) gens.push(function () { var c = rnd(DR_COMBOS.filter(function (x) { var mg = cleanMG(geometry(x[0], x[1]).mg); return mg !== 'linear' && mg !== 'bent'; })); return { t: 'rev', r: c[0], l: c[1] }; });
    if (set.sMol) gens.push(function () { var ak = asks.slice(); if (set.pol) ak.push('pol'); return { t: 'mol', f: rnd(DR_MOL), ask: rnd(ak) }; });
  }

  return rnd(gens)();
}
function specKey(s) { return JSON.stringify(s); }

/* ---------- build a question from a spec ---------- */
function chartLine(g) {

  var mg = cleanMG(g.mg);
  base += g.lp ? ' · with ' + lpWord(g.lp) + ' → <b>' + mg + '</b>' : ' · no lone pairs → same name';
  base += ' · angles <b>' + g.angles + '</b>';
  return base;
}
function angleTip(g) {
  if (/^</.test(g.angles)) return 'Lone pairs on a ' + g.eg + ' family squeeze the angle → pick the "<" option.';
  if (g.regions === 5 && g.lp === 2) return 'T-shaped loses the 120° (no triangle left): 90°, 180°.';
  if (g.regions === 5 && g.lp === 3) return 'Linear from 5 regions: only 180° is left.';
  if (g.regions === 5 && g.lp === 1) return 'Seesaw keeps all three: 90°, 120°, 180°.';

}
function makeQ(spec) {

    var fr = formulaFromName(r.name);
    return { spec: spec, type: 'text', tag: 'Formulas', prompt: 'Write the formula', big: esc(r.name), answer: spec.f, answerHTML: formulaHTML(P), why: fr.error ? r.why : fr.why, kind: r.type, ph: 'e.g. Mg(NO3)2', check: checkFormula, mono: true };

    return { spec: spec, type: 'mc', tag: 'Shapes', prompt: A.label + '?', big: spec.r + ' regions <span class="dim">·</span> ' + lpWord(spec.l), sub: 'on the central atom', opts: A.opts, answer: A.get(g), why: [chartLine(g)].concat(tip ? [tip] : []) };
  }
  if (spec.t === 'rev') {

    var wrong = shuffle(DR_COMBOS.filter(function (c) { return !(c[0] === spec.r && c[1] === spec.l); })).slice(0, 5);
    var opts = shuffle(wrong.map(lbl).concat([lbl([spec.r, spec.l])]));
    return { spec: spec, type: 'mc', tag: 'Shapes (reverse)', prompt: 'How many regions and lone pairs make this shape?', big: mg, sub: 'molecular geometry', opts: opts, answer: lbl([spec.r, spec.l]), why: [chartLine(g2)] };
  }

    else { opts2 = ASK[ask].opts; ans = ASK[ask].get(g3); label = ASK[ask].label + (ask === 'hyb' ? ' of the central ' + ci.el : '') + '?'; }
    var why = [L.description[0] + ' That\'s ' + ci.regions + ' regions (' + (ci.regions - g3.lp) + ' atoms + ' + lpWord(g3.lp) + ').', chartLine(g3)];
    if (ask === 'angle' && angleTip(g3)) why.push(angleTip(g3));
    if (ask === 'pol') why = why.concat(L.polSteps.map(esc));
    return { spec: spec, type: 'mc', tag: 'Real molecules', prompt: label, big: formulaHTML(L.P), sub: L.totalE + ' valence e⁻ — draw it first', opts: opts2, answer: ans, why: why, lewisL: L };
  }
  return null;
}

/* ---------- answer checking ---------- */
function normName(s) { return String(s || '').toLowerCase().replace(/aluminium/g, 'aluminum').replace(/sulphur/g, 'sulfur').replace(/\s+/g, ' ').replace(/\s*\(\s*/g, '(').replace(/\s*\)\s*/g, ') ').trim(); }
function lev(a, b) {
  var m = a.length, n = b.length, d = [];
  for (var i = 0; i <= m; i++) { d[i] = [i]; }
  for (var j = 0; j <= n; j++) d[0][j] = j;
  for (i = 1; i <= m; i++) for (j = 1; j <= n; j++) d[i][j] = Math.min(d[i - 1][j] + 1, d[i][j - 1] + 1, d[i - 1][j - 1] + (a[i - 1] === b[j - 1] ? 0 : 1));
  return d[m][n];
}
function altNames(name) {

  return alts;
}
function checkName(q, u) {
  var n = normName(u);

  if (altNames(q.answer).some(function (a) { return normName(a) === n; })) return { ok: true };
  var a = normName(q.answer), hints = [];
  var ansHasNum = /\(/.test(a), userHasNum = /\(/.test(n);
  var stripNum = function (s) { return s.replace(/\([ivxl]+\)\s*/g, '').replace(/\s+/g, ' ').trim(); };
  if (ansHasNum && !userHasNum) hints.push('Transition metal → it needs a Roman numeral for the metal\'s charge.');
  else if (!ansHasNum && userHasNum) hints.push(q.kind === 'covalent' ? 'Two nonmetals → prefixes, never a Roman numeral.' : 'Columns 1–2, Al, and NH₄⁺ never get a Roman numeral.');
  else if (ansHasNum && stripNum(a) === stripNum(n)) hints.push('Right pattern, wrong Roman numeral. Get the metal charge from the anion.');
  if (/\bl+\)/.test(n) || /\([il]*l[il]*\)/.test(n)) hints.push('Roman numerals use capital I, not lowercase L.');
  if (q.kind !== 'covalent' && /\b(mono|di|tri|tetra|penta|hexa)/.test(n) && !/\b(mono|di|tri|tetra|penta|hexa)/.test(a.replace('dihydrogen', '').replace('hydrogen', ''))) hints.push('Ionic names don\'t use prefixes.');
  if (q.kind === 'covalent' && /^mono/.test(n)) hints.push('Never "mono" on the FIRST element.');
  if (q.kind === 'covalent' && /\bmono/.test(a) && !/\bmono/.test(n)) hints.push('The SECOND element does get "mono".');
  if (q.kind === 'acid') {
    if (/hydro/.test(n) && !/hydro/.test(a)) hints.push('Only H + a single element gets "hydro". Polyatomic acids drop it.');
    if (!/hydro/.test(n) && /hydro/.test(a)) hints.push('H + one element (no oxygen) → hydro___ic acid.');
    if (/ic acid/.test(n) && /ous acid/.test(a)) hints.push('-ite → -ous acid.');
    if (/ous acid/.test(n) && /ic acid/.test(a)) hints.push('-ate → -ic acid.');
  }

}
function checkFormula(q, u) {
  var raw = String(u || '').trim();
  if (!raw) return { ok: false, msg: 'Type a formula first.' };
  var ans = q.answer, P = parseFormula(raw);
  if (P.error) {
    if (raw.replace(/\s/g, '').toLowerCase() === ans.toLowerCase()) return { ok: false, msg: 'Only the capitals are off. Symbols are a capital + lowercase letter (Li, not LI).' };
    return { ok: false, msg: P.error };
  }
  var t = itemsText(P.items);

  if (ka === kb) return { ok: false, msg: 'Right atoms and counts, but the way it\'s written is off. Check the parentheses and put the positive ion first.' };
  var ks = Object.keys(A), ratio = null, mult = ks.length === Object.keys(B).length && ks.every(function (k) { if (!B[k]) return false; var r = B[k] / A[k]; if (ratio === null) ratio = r; return r === ratio; });
  if (mult && ratio > 1 && Number.isInteger(ratio)) return { ok: false, msg: 'Not reduced. Divide the subscripts down to the lowest ratio.' };
  if (/\d{2,}/.test(raw.replace(/\(.*?\)\d?/g, '')) && /[A-Z][a-z]?\d?O\d\d/.test(raw)) return { ok: false, msg: 'Looks like parentheses are missing around the polyatomic ion.' };
  return { ok: false, msg: 'Check the charges: cross and drop, then reduce.' };
}

/* ---------- session state ---------- */
var DRILL = {
  set: LS.get('set', { mode: 'naming', nFixed: true, nTM: true, nCov: true, nAcid: true, dir: 'both', sRL: true, sRev: true, sMol: true, asks: { eg: true, mg: true, angle: true, hyb: true }, pol: true }),
  run: null
};
function newRun(mode) {
  DRILL.set.mode = mode; LS.set('set', DRILL.set);
  DRILL.run = { mode: mode, n: 0, right: 0, streak: 0, queue: [], misses: [], q: null, answered: false, lastKey: null };
}
function savedMisses() { return LS.get('misses', []); }
function addSavedMiss(spec) { var m = savedMisses(), k = specKey(spec); if (m.some(function (x) { return specKey(x) === k; })) return; m.unshift(spec); LS.set('misses', m.slice(0, 80)); }

function nextQ() {
  var R = DRILL.run, q = null, tries = 0;
  var due = R.queue.findIndex(function (x) { return x.due <= R.n; });
  if (due >= 0) { q = makeQ(R.queue[due].spec); q.retry = true; R.queue.splice(due, 1); }
  else if (R.mode === 'misses') {
    var m = savedMisses();
    if (!m.length) { R.q = null; return; }
    var cands = m.filter(function (s) { return specKey(s) !== R.lastKey; });
    q = makeQ(rnd(cands.length ? cands : m));
  }
  while (!q && tries++ < 30) { var s = genSpec(Object.assign({}, DRILL.set, { mode: R.mode })); if (!s) break; if (specKey(s) === R.lastKey) continue; q = makeQ(s); }
  R.q = q; R.answered = false;
  if (q) R.lastKey = specKey(q.spec);
}

/* ---------- rendering ---------- */
function renderDrill(h) {
  var parts = h.split('/');
  if (parts[1] === 'go' && parts[2]) { newRun(parts[2]); nextQ(); history.replaceState(null, '', '#/drill/run'); return renderDrillRun(); }
  if (parts[1] === 'run' && DRILL.run) return renderDrillRun();
  renderDrillSetup();
}
function tog(key, label, on, sub) { return '<label class="tog"><input type="checkbox" data-t="' + key + '"' + (on ? ' checked' : '') + '><span>' + label + (sub ? '<small>' + sub + '</small>' : '') + '</span></label>'; }
function renderDrillSetup() {
  var S = DRILL.set, mc = savedMisses().length, best = LS.get('best', 0);
  var html = '<nav class="trail"><a href="#/" class="crumb">Start</a><span class="sep">›</span><span class="crumb here">Drill</span></nav>';
  html += '<section class="hero"><p class="eyebrow">Memorize</p><h1>Drill naming and shapes</h1><p class="lede">Quick-fire questions. Anything you miss comes back a few questions later, and it\'s saved to your miss list until you get it right.' + (best ? ' Best streak: <b>' + best + '</b>.' : '') + '</p></section>';
  html += '<div class="drillgrid">';
  html += '<section class="card dcard tag-name"><h2>Naming &amp; formulas</h2><div class="togs">' + tog('nFixed', 'Columns 1–2, Al, NH₄⁺', S.nFixed, 'name + ide / polyatomic') + tog('nTM', 'Transition metals', S.nTM, 'Roman numerals') + tog('nCov', 'Two nonmetals', S.nCov, 'prefixes') + tog('nAcid', 'Acids', S.nAcid, 'hydro-ic, -ic, -ous') + '</div><p class="lbl">Direction</p><div class="seg" data-dir>' + [['toName', 'Formula → name'], ['toFormula', 'Name → formula'], ['both', 'Both']].map(function (d) { return '<button type="button" data-d="' + d[0] + '" class="' + (S.dir === d[0] ? 'on' : '') + '">' + d[1] + '</button>'; }).join('') + '</div><a class="btn primary" href="#/drill/go/naming">Start naming drill →</a></section>';
  html += '<section class="card dcard tag-bond"><h2>Shapes, angles &amp; hybridization</h2><div class="togs">' + tog('sRL', 'Regions + lone pairs → answer', S.sRL, '"4 regions, 1 lone pair"') + tog('sRev', 'Shape → regions', S.sRev, 'reverse: seesaw = ?') + tog('sMol', 'Real molecules', S.sMol, 'SF₄, BrF₃, CO₃²⁻…') + '</div><p class="lbl">Ask me for</p><div class="togs inline">' + tog('a_eg', 'Electron geometry', S.asks.eg) + tog('a_mg', 'Molecular geometry', S.asks.mg) + tog('a_angle', 'Bond angles', S.asks.angle) + tog('a_hyb', 'Hybridization', S.asks.hyb) + tog('pol', 'Polarity (real molecules)', S.pol) + '</div><a class="btn primary" href="#/drill/go/shapes">Start shapes drill →</a></section>';
  html += '</div><div class="navrow"><a class="btn" href="#/drill/go/mixed">Mixed: both drills</a>' + (mc ? '<a class="btn" href="#/drill/go/misses">Practice my misses (' + mc + ')</a><button type="button" class="btn ghost" id="clearMiss">Clear miss list</button>' : '') + '</div>';
  html += '<details class="card ref"><summary>Shapes chart (reference)</summary>' + refChart() + '</details>';
  app.innerHTML = html;
  app.querySelectorAll('.tog input').forEach(function (i) {
    i.addEventListener('change', function () {
      var k = i.dataset.t;
      if (k.indexOf('a_') === 0) DRILL.set.asks[k.slice(2)] = i.checked; else DRILL.set[k] = i.checked;
      LS.set('set', DRILL.set);
    });
  });
  app.querySelectorAll('[data-dir] button').forEach(function (b) { b.addEventListener('click', function () { DRILL.set.dir = b.dataset.d; LS.set('set', DRILL.set); app.querySelectorAll('[data-dir] button').forEach(function (x) { x.classList.toggle('on', x === b); }); }); });

}
function refChart() {
  var rows = [[2, [0]], [3, [0, 1]], [4, [0, 1, 2]], [5, [0, 1, 2, 3]], [6, [0, 1, 2]]];
  return '<div class="refc">' + rows.map(function (r) {
    var g0 = geometry(r[0], 0);
    return '<div class="refrow"><p><b>' + r[0] + ' regions</b> — ' + g0.eg + ' · ' + g0.hyb + '</p><ul>' + r[1].map(function (lp) { var g = geometry(r[0], lp); return '<li>' + lp + ' LP → <b>' + cleanMG(g.mg) + '</b> <span class="dim">' + g.angles + '</span></li>'; }).join('') + '</ul></div>';
  }).join('') + '</div>';
}
function renderDrillRun() {

  var title = { naming: 'Naming drill', shapes: 'Shapes drill', mixed: 'Mixed drill', misses: 'Practicing misses' }[R.mode];
  var html = '<nav class="trail"><a href="#/" class="crumb">Start</a><span class="sep">›</span><a href="#/drill" class="crumb">Drill</a><span class="sep">›</span><span class="crumb here">' + title + '</span></nav>';
  html += '<div class="scorebar"><span><b>' + R.right + '</b> / ' + R.n + ' right</span><span>Streak <b>' + R.streak + '</b></span><span>Best <b>' + Math.max(best, R.streak) + '</b></span><span class="dim">' + (R.queue.length ? R.queue.length + ' coming back' : '') + '</span><a class="btn ghost small" href="#/drill">Settings</a></div>';
  if (!q) {
    html += '<div class="card"><h1>' + (R.mode === 'misses' ? 'Miss list cleared' : 'Nothing to drill') + '</h1><p class="lede">' + (R.mode === 'misses' ? 'You\'ve answered every saved miss correctly.' : 'Turn on at least one category in Settings.') + '</p><div class="navrow"><a class="btn" href="#/drill">Back to Drill settings</a></div></div>';
    app.innerHTML = html; return;
  }
  html += '<div class="card dq"><p class="eyebrow">' + esc(q.tag) + (q.retry ? ' · <span class="again">again</span>' : '') + '</p><p class="qprompt">' + esc(q.prompt) + '</p><div class="qbig' + (q.type === 'text' && q.tag === 'Naming' ? ' mono' : '') + '">' + q.big + '</div>' + (q.sub ? '<p class="hint">' + esc(q.sub) + '</p>' : '');
  if (q.type === 'mc') html += '<div class="mc">' + q.opts.map(function (o, i) { return '<button type="button" data-o="' + esc(o) + '"><span class="k">' + (i < 9 ? i + 1 : '') + '</span>' + esc(o) + '</button>'; }).join('') + '</div>';
  else html += '<form class="ta" autocomplete="off"><input id="ans" placeholder="' + esc(q.ph) + '" autocapitalize="off" autocorrect="off" spellcheck="false"' + (q.mono ? ' class="mono"' : '') + '><button class="btn primary" type="submit">Check</button><button class="btn ghost" type="button" id="idk">Show me</button></form>';
  html += '<div id="fb"></div></div>';
  if (R.misses.length) html += '<details class="card ref"><summary>Missed this round (' + R.misses.length + ')</summary><ul class="why">' + R.misses.map(function (m) { return '<li>' + m.big + ' → <b>' + m.ans + '</b></li>'; }).join('') + '</ul></details>';
  app.innerHTML = html;

    app.querySelector('form.ta').addEventListener('submit', function (e) { e.preventDefault(); if (R.answered) { advance(); return; } var r = q.check(q, inp2.value); if (!r.ok && /first\.$/.test(r.msg || '')) { showFb('<p class="cmp cmp-bad">' + esc(r.msg) + '</p>'); return; } grade(r.ok, inp2.value, r.msg); });

  }
}
function showFb(h) { document.getElementById('fb').innerHTML = h; }
function grade(ok, given, msg) {
  var R = DRILL.run, q = R.q;
  R.answered = true; R.n++;
  if (ok) {
    R.right++; R.streak++;
    if (R.streak > LS.get('best', 0)) LS.set('best', R.streak);
    removeSavedMiss(q.spec);
  } else {
    R.streak = 0;
    R.queue.push({ spec: q.spec, due: R.n + 3 });
    addSavedMiss(q.spec);
    R.misses.push({ big: q.big, ans: q.answerHTML || esc(q.answer) });
  }
  if (q.type === 'mc') {
    app.querySelectorAll('.mc button').forEach(function (b) {
      b.disabled = true;
      if (b.dataset.o === q.answer) b.classList.add('right');
      else if (b.dataset.o === given) b.classList.add('wrong');
    });
  } else { var i = document.getElementById('ans'); i.readOnly = true; i.classList.add(ok ? 'ok' : 'bad'); }
  var fb = '<div class="res ' + (ok ? 'res-ok' : '') + '">' + (ok ? '<p class="verdict v-non">Correct</p>' : '<p class="verdict v-polar">' + (given === '' ? 'Answer' : 'Not quite') + '</p>' + (msg && msg !== 'Skipped.' ? '<p><b>' + esc(msg) + '</b></p>' : '') + '<p>Answer: <b class="ansv">' + (q.answerHTML || esc(q.answer)) + '</b>' + (q.tag === 'Formulas' ? ' <span class="dim">(type it as ' + esc(q.answer) + ')</span>' : '') + '</p>') + '<ul class="why">' + q.why.map(function (w) { return '<li>' + w + '</li>'; }).join('') + '</ul>' + (q.lewisL ? '<details class="lwd"' + (ok ? '' : ' open') + '><summary>Show the Lewis structure</summary><div class="lewisbox">' + drawLewis(q.lewisL) + '</div></details>' : '') + (ok ? '' : '<p class="hint">This one will come back in a few questions.</p>') + '<button type="button" class="btn primary" id="nextq">Next →</button> <span class="hint kbd">or press Enter</span></div>';
  showFb(fb);
  document.getElementById('nextq').addEventListener('click', advance);
  var sb = app.querySelector('.scorebar'); if (sb) sb.innerHTML = '<span><b>' + R.right + '</b> / ' + R.n + ' right</span><span>Streak <b>' + R.streak + '</b></span><span>Best <b>' + LS.get('best', 0) + '</b></span><span class="dim">' + (R.queue.length ? R.queue.length + ' coming back' : '') + '</span><a class="btn ghost small" href="#/drill">Settings</a>';
  if (q.type === 'mc' && window.matchMedia('(pointer:fine)').matches) document.getElementById('nextq').focus();
}
function advance() { nextQ(); renderDrillRun(); window.scrollTo(0, 0); }
document.addEventListener('keydown', function (e) {
  if (!DRILL.run || location.hash.indexOf('#/drill/run') !== 0) return;
  var R = DRILL.run, q = R.q; if (!q) return;
  if (e.target && e.target.tagName === 'INPUT') return;
  if (R.answered && e.key === 'Enter') { e.preventDefault(); advance(); return; }
  if (!R.answered && q.type === 'mc' && /^[1-9]$/.test(e.key)) { var b = app.querySelectorAll('.mc button')[+e.key - 1]; if (b) b.click(); }
});
